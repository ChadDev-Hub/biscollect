services:
  biscollect-prod-standalone:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASESERVERURL: ${NEXT_PUBLIC_BASESERVERURL}
    image: chaddevhub/biscollect:prod
    container_name: biscollect-prod
    env_file:
      - "frontend/.env"
    ports:
      - "3003:3003"

  biscollect-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: chaddevhub/biscollect:dev
    container_name: biscollect-dev
    env_file:
      - "frontend/.env.dev"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json
    ports:
      - "3003:3003"
